name: Build dan Push Docker Image ke GHCR

# Workflow ini terpicu saat ada push ke branch main atau dev,
# atau bisa dijalankan manual lewat tombol "Run workflow" di GitHub.
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Izin yang dibutuhkan:
# - contents: read  → checkout kode
# - packages: write → push image ke GHCR
permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push ke GHCR
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode terbaru dari repository
      - name: Checkout kode
        uses: actions/checkout@v4

      # 2. Login ke GitHub Container Registry (ghcr.io).
      #    GITHUB_TOKEN disediakan otomatis oleh GitHub — tidak perlu
      #    membuat secret manual, tidak ada kata sandi di kode.
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Paksa nama image menjadi huruf kecil semua.
      #    GHCR menolak nama yang mengandung huruf kapital. Nama repository
      #    mengandung "SV" (huruf besar), jadi kita paksa lowercase di sini.
      - name: Siapkan nama image (lowercase)
        id: image_name
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Nama image: ${IMAGE}"

      # 4. Setup Docker Buildx — diperlukan untuk fitur multi-platform
      #    dan cache build yang lebih canggih.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Bangun image dari Dockerfile multi-stage, lalu push ke GHCR
      #    dengan DUA tag:
      #    - ${{ github.sha }} : tag unik per commit, memudahkan rollback
      #    - latest            : penunjuk ke versi terbaru
      - name: Build dan Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.image }}:${{ github.sha }}
            ${{ steps.image_name.outputs.image }}:latest
          # Cache layer build menggunakan GitHub Actions cache,
          # sehingga build berikutnya lebih cepat jika tidak ada perubahan.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Tampilkan ringkasan hasil build ke log untuk bukti dokumentasi
      - name: Tampilkan ringkasan
        run: |
          echo "=================================================="
          echo "  IMAGE BERHASIL DIPUSH KE GHCR"
          echo "=================================================="
          echo "  Nama image : ${{ steps.image_name.outputs.image }}"
          echo "  Tag SHA    : ${{ github.sha }}"
          echo "  Tag latest : latest"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "=================================================="
          echo ""
          echo "Cara menarik image ini:"
          echo "  docker pull ${{ steps.image_name.outputs.image }}:${{ github.sha }}"
          echo "  docker pull ${{ steps.image_name.outputs.image }}:latest"
